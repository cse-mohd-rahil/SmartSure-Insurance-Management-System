server:
  port: 8080

spring:
  application:
    name: API-Gateway

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: lb://AuthService
          predicates:
            - Path=/api/auth/**

        - id: policy-service
          uri: lb://PolicyService
          predicates:
            - Path=/api/policies/**

        - id: claim-service
          uri: lb://ClaimsService
          predicates:
            - Path=/api/claims/**

        - id: admin-service
          uri: lb://AdminService
          predicates:
            - Path=/api/admin/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: AuthService
        url: /api/auth/v3/api-docs
      - name: PolicyService
        url: /api/policies/v3/api-docs
      - name: ClaimsService
        url: /api/claims/v3/api-docs
      - name: AdminService
        url: /api/admin/v3/api-docs