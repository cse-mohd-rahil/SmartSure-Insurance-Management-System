server:
  port: 8081

spring:
  application:
    name: AUTHSERVICE

  datasource:
    url: jdbc:mysql://mysql:3306/auth_db
    username: root
    password: Root@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

# ✅ LOGGING (FIXED)
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# ✅ ZIPKIN + TRACING (FIXED)
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans


