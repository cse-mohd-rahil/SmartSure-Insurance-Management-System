server:
  port: 8082

spring:
  application:
    name: PolicyService

  datasource:
    url: jdbc:mysql://localhost:3306/policy_db
    username: root
    password: Root@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/